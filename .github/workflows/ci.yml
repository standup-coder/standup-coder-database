name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Markdown Schema 校验（硬门槛）
  # 数据债已于 2026-07-21 清零，升级为硬门槛
  # ──────────────────────────────────────────────
  validate-schema:
    name: Markdown Schema 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行 schema 校验
        run: python3 scripts/validate_schema.py

      - name: 失败时上传问题报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-issues
          path: docs/reports/schema-issues-*.md
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # Job 2: 前端构建验证（硬门槛）
  # ──────────────────────────────────────────────
  build-console:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

  # ──────────────────────────────────────────────
  # Job 3: 前端 Lint（硬门槛）
  # ──────────────────────────────────────────────
  lint-console:
    name: 前端代码规范
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint
