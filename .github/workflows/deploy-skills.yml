name: Deploy skills viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'skills/catalog/**'
      - 'skills/sources/**'
      - 'skills/tools/web/**'
      - '.github/workflows/deploy-skills.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skills/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build web site from catalog
        run: npm run web:build

      - name: Stage site for Pages
        run: |
          mkdir -p tools/web/site
          cp tools/web/index.html tools/web/site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: skills/tools/web/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5